<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" width="320" height="660" role="img" aria-labelledby="t d">
  <title id="t">N Player settings screen</title>
  <desc id="d">Settings screen: account details, an Appearance section with a segmented Light, Dark and System theme control, a biometric lock switch, and a sign out button.</desc>
  <defs>

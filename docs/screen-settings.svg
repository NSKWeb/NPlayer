<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 660" width="320" height="660" role="img" aria-labelledby="t d">
  <title id="t">N Player settings screen</title>
  <desc id="d">Settings screen: an Appearance section with a segmented Light, Dark and System theme control, a biometric lock switch, an About section, and the bottom navigation bar with Settings selected.</desc>
  <defs>
    <clipPath id="scr"><rect x="16" y="16" width="288" height="628" rx="28"/></clipPath>
  </defs>

  <rect width="320" height="660" fill="#08080B"/>
  <rect x="6" y="6" width="308" height="648" rx="34" fill="#15161E" stroke="#2C3546" stroke-width="2"/>
  <rect x="16" y="16" width="288" height="628" rx="28" fill="#0C0D12"/>
  <g clip-path="url(#scr)">
    <text x="34" y="42" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#8B98AE">9:41</text>
    <g fill="#8B98AE">
      <rect x="242" y="35" width="3" height="8" rx="1"/>
      <rect x="248" y="32" width="3" height="11" rx="1"/>
      <rect x="254" y="29" width="3" height="14" rx="1"/>
      <rect x="262" y="32" width="16" height="10" rx="3" fill="none" stroke="#8B98AE" stroke-width="1.4"/>
      <rect x="264" y="34" width="10" height="6" rx="1.5"/>
    </g>

    <text x="28" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#E8ECF3">Appearance</text>
    <text x="28" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#E8ECF3">Theme</text>
    <text x="28" y="134" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B98AE">Choose light, dark, or follow the system setting</text>
    <rect x="28" y="148" width="264" height="40" rx="20" fill="none" stroke="#3A4557" stroke-width="1.2"/>
    <line x1="116" y1="154" x2="116" y2="182" stroke="#3A4557" stroke-width="1"/>
    <line x1="204" y1="154" x2="204" y2="182" stroke="#3A4557" stroke-width="1"/>
    <rect x="32" y="152" width="80" height="32" rx="16" fill="#9ECAFF"/>
    <g fill="#0B0B0F">
      <circle cx="62" cy="164" r="4.4" fill="none" stroke="#0B0B0F" stroke-width="1.6"/>
      <line x1="62" y1="162.6" x2="62" y2="158" stroke="#0B0B0F" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="62" y1="165.4" x2="62" y2="170" stroke="#0B0B0F" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="60.6" y1="164" x2="56" y2="164" stroke="#0B0B0F" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="63.4" y1="164" x2="68" y2="164" stroke="#0B0B0F" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <text x="90" y="173" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0B0B0F">System</text>
    <circle cx="150" cy="164" r="4.4" fill="none" stroke="#8B98AE" stroke-width="1.6"/>
    <g stroke="#8B98AE" stroke-width="1.6" stroke-linecap="round">
      <line x1="150" y1="156.4" x2="150" y2="154.6"/>
      <line x1="150" y1="173.4" x2="150" y2="171.6"/>
      <line x1="142.4" y1="164" x2="140.6" y2="164"/>
      <line x1="159.4" y1="164" x2="157.6" y2="164"/>
    </g>
    <text x="178" y="173" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#8B98AE">Light</text>
    <path d="M247.6,158 A7,7 0 1 0 247.6,170 A5.6,5.6 0 1 1 247.6,158 Z" fill="#8B98AE"/>
    <text x="266" y="173" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#8B98AE">Dark</text>
    <line x1="28" y1="208" x2="292" y2="208" stroke="#2E3646" stroke-width="1"/>

    <text x="28" y="244" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#E8ECF3">Biometric lock</text>
    <text x="28" y="262" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B98AE">Require biometric unlock to open the app</text>
    <rect x="244" y="238" width="48" height="26" rx="13" fill="#9ECAFF"/>
    <circle cx="280" cy="251" r="10" fill="#0B0B0F"/>
    <line x1="28" y1="296" x2="292" y2="296" stroke="#2E3646" stroke-width="1"/>

    <text x="28" y="330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#E8ECF3">About</text>
    <text x="28" y="354" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B98AE">N Player plays the video and audio already on this device.</text>
    <text x="28" y="370" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8B98AE">No account, no server, no network access.</text>
    <text x="28" y="392" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#6E7A90">Version 1.0.0</text>

    <rect x="16" y="560" width="288" height="84" fill="#121218"/>
    <line x1="16" y1="560" x2="304" y2="560" stroke="#20232C" stroke-width="1"/>
    <path d="M40.0,593 L40.0,584 L49.0,576 L58.0,584 L58.0,593 Z" fill="#4A5568"/>
    <text x="49.0" y="610" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#4A5568">Home</text>
    <circle cx="120.0" cy="584" r="6.5" fill="none" stroke="#4A5568" stroke-width="2"/><line x1="124.6" y1="588.4" x2="129.0" y2="593" stroke="#4A5568" stroke-width="2" stroke-linecap="round"/>
    <text x="121.0" y="610" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#4A5568">Search</text>
    <path d="M193,586 C190,583 185,584 185,589 C185,594 193,599 193,599 C193,599 201,594 201,589 C201,584 196,583 193,586 Z" fill="none" stroke="#4A5568" stroke-width="2"/>
    <text x="193.0" y="610" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#4A5568">Favourites</text>
    <circle cx="265.0" cy="586" r="6.2" fill="none" stroke="#9ECAFF" stroke-width="2.2"/><circle cx="265.0" cy="586" r="2" fill="#9ECAFF"/><line x1="265.0" y1="580.4" x2="265.0" y2="577" stroke="#9ECAFF" stroke-width="2.2" stroke-linecap="round"/><line x1="265.0" y1="591.6" x2="265.0" y2="595" stroke="#9ECAFF" stroke-width="2.2" stroke-linecap="round"/><line x1="259.4" y1="586.0" x2="256.0" y2="586" stroke="#9ECAFF" stroke-width="2.2" stroke-linecap="round"/><line x1="270.6" y1="586.0" x2="274.0" y2="586" stroke="#9ECAFF" stroke-width="2.2" stroke-linecap="round"/>
    <text x="265.0" y="610" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#9ECAFF">Settings</text>
  </g>
</svg>

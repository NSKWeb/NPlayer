<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">N Player</title>
  <desc id="desc">Hero banner: N Player, a native Android client for the Jellyfin server you run. Feature chips for Jellyfin, offline downloads, resume sync, Media3 and Compose.</desc>

  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B0F"/>
      <stop offset="55%" stop-color="#12141D"/>
      <stop offset="100%" stop-color="#101822"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#9ECAFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#9ECAFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="poster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E5C86"/>
      <stop offset="100%" stop-color="#1B2740"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#hbg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- accent rule -->
  <rect x="80" y="96" width="64" height="5" rx="2.5" fill="#9ECAFF"/>

  <text x="80" y="176" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="66" font-weight="700" fill="#F4F7FC">N Player</text>

  <text x="80" y="222" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#C3CEE0">Your media. Your server. Your rules.</text>

  <text x="80" y="256" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#8B98AE">A native Android client for the Jellyfin server you operate — browse, stream, download, and keep watch progress in sync.</text>

  <!-- chips -->
  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">
    <rect x="80" y="290" width="112" height="36" rx="18" fill="#17253A" stroke="#2E4666" stroke-width="1.2"/>
    <text x="100" y="313" fill="#9ECAFF">Jellyfin</text>

    <rect x="204" y="290" width="182" height="36" rx="18" fill="#17253A" stroke="#2E4666" stroke-width="1.2"/>
    <text x="224" y="313" fill="#9ECAFF">Offline downloads</text>

    <rect x="398" y="290" width="146" height="36" rx="18" fill="#17253A" stroke="#2E4666" stroke-width="1.2"/>
    <text x="418" y="313" fill="#9ECAFF">Resume sync</text>

    <rect x="556" y="290" width="112" height="36" rx="18" fill="#17253A" stroke="#2E4666" stroke-width="1.2"/>
    <text x="576" y="313" fill="#9ECAFF">Media3</text>

    <rect x="680" y="290" width="130" height="36" rx="18" fill="#17253A" stroke="#2E4666" stroke-width="1.2"/>
    <text x="700" y="313" fill="#9ECAFF">Compose</text>
  </g>

  <!-- stylised device -->
  <g>
    <rect x="928" y="34" width="216" height="360" rx="30" fill="#15161E" stroke="#2C3546" stroke-width="2"/>
    <rect x="938" y="44" width="196" height="340" rx="22" fill="#0C0D12"/>
    <rect x="1002" y="52" width="68" height="9" rx="4.5" fill="#22252F"/>

    <!-- mini poster grid inside device -->
    <rect x="952" y="76" width="52" height="78" rx="6" fill="url(#poster)"/>
    <rect x="1010" y="76" width="52" height="78" rx="6" fill="#22314C"/>
    <rect x="1068" y="76" width="52" height="78" rx="6" fill="#2C3F60"/>
    <rect x="952" y="166" width="52" height="78" rx="6" fill="#2C3F60"/>
    <rect x="1010" y="166" width="52" height="78" rx="6" fill="url(#poster)"/>
    <rect x="1068" y="166" width="52" height="78" rx="6" fill="#22314C"/>
    <rect x="952" y="256" width="52" height="78" rx="6" fill="#22314C"/>
    <rect x="1010" y="256" width="52" height="78" rx="6" fill="#2C3F60"/>
    <rect x="1068" y="256" width="52" height="78" rx="6" fill="url(#poster)"/>

    <!-- mini nav -->
    <rect x="938" y="352" width="196" height="32" fill="#121218"/>
    <circle cx="972" cy="368" r="5" fill="#9ECAFF"/>
    <circle cx="1016" cy="368" r="5" fill="#4A5568"/>
    <circle cx="1060" cy="368" r="5" fill="#4A5568"/>
    <circle cx="1104" cy="368" r="5" fill="#4A5568"/>
  </g>
</svg>

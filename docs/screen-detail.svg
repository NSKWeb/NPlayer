    <circle cx="265.0" cy="586" r="6.2" fill="none" stroke="#4A5568" stroke-width="2.2"/><circle cx="265.0" cy="586" r="2" fill="#4A5568"/><line x1="265.0" y1="580.4" x2="265.0" y2="577" stroke="#4A5568" stroke-width="2.2" stroke-linecap="round"/><line x1="265.0" y1="591.6" x2="265.0" y2="595" stroke="#4A5568" stroke-width="2.2" stroke-linecap="round"/><line x1="259.4" y1="586.0" x2="256.0" y2="586" stroke="#4A5568" stroke-width="2.2" stroke-linecap="round"/><line x1="270.6" y1="586.0" x2="274.0" y2="586" stroke="#4A5568" stroke-width="2.2" stroke-linecap="round"/>
    <text x="265.0" y="610" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#4A5568">Settings</text>

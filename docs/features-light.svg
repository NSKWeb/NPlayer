<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="ft fd">
  <title id="ft">N Player features</title>
  <desc id="fd">Six feature cards: direct play first, offline downloads, resume anywhere, biometric lock, fast library search, and dynamic colour.</desc>
  <rect width="1000" height="330" rx="20" fill="#FFFFFF"/>
    <rect x="20" y="20" width="306" height="96" rx="16" fill="#F7F9FC" stroke="#DCE3EE" stroke-width="1.4"/>
    <circle cx="58" cy="60" r="20" fill="#1D4ED8" fill-opacity="0.16"/>
    <path d="M52,51 L52,69 L67,60 Z" fill="#1D4ED8"/>
    <text x="92" y="58" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0F1729">Direct play first</text>
    <text x="92" y="80" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6478">Plays the original file.</text>
    <rect x="342" y="20" width="306" height="96" rx="16" fill="#F7F9FC" stroke="#DCE3EE" stroke-width="1.4"/>
    <circle cx="380" cy="60" r="20" fill="#1D4ED8" fill-opacity="0.16"/>
    <line x1="380" y1="50" x2="380" y2="61" stroke="#1D4ED8" stroke-width="2.4" stroke-linecap="round"/><path d="M375,58 L380,64 L385,58 Z" fill="#1D4ED8"/><line x1="371" y1="68" x2="389" y2="68" stroke="#1D4ED8" stroke-width="2.4" stroke-linecap="round"/>
    <text x="414" y="58" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0F1729">Offline downloads</text>
    <text x="414" y="80" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6478">Wi-Fi only by default.</text>
    <rect x="664" y="20" width="306" height="96" rx="16" fill="#F7F9FC" stroke="#DCE3EE" stroke-width="1.4"/>
    <circle cx="702" cy="60" r="20" fill="#067647" fill-opacity="0.16"/>
    <path d="M693,61 A9,9 0 0 1 711,57" fill="none" stroke="#067647" stroke-width="2.4" stroke-linecap="round"/><path d="M707,53 L711,57 L707,61" fill="none" stroke="#067647" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M711,59 A9,9 0 0 1 693,63" fill="none" stroke="#067647" stroke-width="2.4" stroke-linecap="round"/><path d="M697,67 L693,63 L697,59" fill="none" stroke="#067647" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="736" y="58" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0F1729">Resume anywhere</text>
    <text x="736" y="80" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6478">Saved on device and server.</text>
    <rect x="20" y="132" width="306" height="96" rx="16" fill="#F7F9FC" stroke="#DCE3EE" stroke-width="1.4"/>
    <circle cx="58" cy="172" r="20" fill="#067647" fill-opacity="0.16"/>
    <rect x="49" y="170" width="18" height="13" rx="3" fill="none" stroke="#067647" stroke-width="2.2"/><path d="M53,170 L53,166 A5,5 0 0 1 63,166 L63,170" fill="none" stroke="#067647" stroke-width="2.2"/><circle cx="58" cy="176" r="2" fill="#067647"/>
    <text x="92" y="170" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0F1729">Biometric lock</text>
    <text x="92" y="192" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6478">Optional, off by default.</text>
    <rect x="342" y="132" width="306" height="96" rx="16" fill="#F7F9FC" stroke="#DCE3EE" stroke-width="1.4"/>
    <circle cx="380" cy="172" r="20" fill="#1D4ED8" fill-opacity="0.16"/>
    <circle cx="378" cy="170" r="7" fill="none" stroke="#1D4ED8" stroke-width="2.4"/><line x1="383" y1="175" x2="389" y2="181" stroke="#1D4ED8" stroke-width="2.4" stroke-linecap="round"/>
    <text x="414" y="170" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0F1729">Fast library search</text>
    <text x="414" y="192" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6478">From two characters.</text>
    <rect x="664" y="132" width="306" height="96" rx="16" fill="#F7F9FC" stroke="#DCE3EE" stroke-width="1.4"/>
    <circle cx="702" cy="172" r="20" fill="#067647" fill-opacity="0.16"/>
    <circle cx="702" cy="172" r="9" fill="none" stroke="#067647" stroke-width="2.2"/><circle cx="699" cy="169" r="1.8" fill="#067647"/><circle cx="705" cy="169" r="1.8" fill="#067647"/><circle cx="702" cy="176" r="1.8" fill="#067647"/>
    <text x="736" y="170" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0F1729">Dynamic colour</text>
    <text x="736" y="192" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6478">Matches your wallpaper.</text>
</svg>

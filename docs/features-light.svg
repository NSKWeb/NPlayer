<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="ft fd">
  <title id="ft">N Player features</title>
  <desc id="fd">Six feature cards: an on-device library, no account or server, resume on device, an optional biometric lock, search this device, and a light, dark or system theme toggle.</desc>
  <rect width="1000" height="330" rx="20" fill="#FFFFFF"/>
    <rect x="20" y="20" width="306" height="96" rx="16" fill="#F7F9FC" stroke="#DCE3EE" stroke-width="1.4"/>
    <circle cx="58" cy="60" r="20" fill="#1D4ED8" fill-opacity="0.16"/>
    <rect x="48" y="50" width="20" height="20" rx="4" fill="none" stroke="#1D4ED8" stroke-width="2.2"/><path d="M54,56 L62,64 L68,54" fill="none" stroke="#1D4ED8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="58" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0F1729">On-device library</text>
    <text x="92" y="80" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6478">Reads straight from MediaStore.</text>
    <rect x="342" y="20" width="306" height="96" rx="16" fill="#F7F9FC" stroke="#DCE3EE" stroke-width="1.4"/>
    <circle cx="380" cy="60" r="20" fill="#067647" fill-opacity="0.16"/>
    <circle cx="380" cy="60" r="9" fill="none" stroke="#067647" stroke-width="2.2"/><line x1="373" y1="60" x2="387" y2="60" stroke="#067647" stroke-width="2.2" stroke-linecap="round"/>
    <text x="414" y="58" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0F1729">No account or server</text>
    <text x="414" y="80" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6478">Nothing to sign in to.</text>
    <rect x="664" y="20" width="306" height="96" rx="16" fill="#F7F9FC" stroke="#DCE3EE" stroke-width="1.4"/>
    <circle cx="702" cy="60" r="20" fill="#1D4ED8" fill-opacity="0.16"/>
    <path d="M694,59 A9,9 0 0 1 710,59" fill="none" stroke="#1D4ED8" stroke-width="2.4" stroke-linecap="round"/><path d="M698,53 L710,59 L698,65" fill="none" stroke="#1D4ED8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="692" y1="68" x2="712" y2="68" stroke="#1D4ED8" stroke-width="2.4" stroke-linecap="round"/>
    <text x="736" y="58" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0F1729">Resume on device</text>
    <text x="736" y="80" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6478">Pick up where you stopped.</text>
    <rect x="20" y="132" width="306" height="96" rx="16" fill="#F7F9FC" stroke="#DCE3EE" stroke-width="1.4"/>
    <circle cx="58" cy="172" r="20" fill="#067647" fill-opacity="0.16"/>
    <rect x="49" y="170" width="18" height="13" rx="3" fill="none" stroke="#067647" stroke-width="2.2"/><path d="M53,170 L53,166 A5,5 0 0 1 63,166 L63,170" fill="none" stroke="#067647" stroke-width="2.2"/><circle cx="58" cy="176" r="2" fill="#067647"/>
    <text x="92" y="170" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0F1729">Biometric lock</text>
    <text x="92" y="192" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6478">Optional, off by default.</text>
    <rect x="342" y="132" width="306" height="96" rx="16" fill="#F7F9FC" stroke="#DCE3EE" stroke-width="1.4"/>
    <circle cx="380" cy="172" r="20" fill="#1D4ED8" fill-opacity="0.16"/>
    <circle cx="378" cy="170" r="7" fill="none" stroke="#1D4ED8" stroke-width="2.4"/><line x1="383" y1="175" x2="389" y2="181" stroke="#1D4ED8" stroke-width="2.4" stroke-linecap="round"/>
    <text x="414" y="170" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0F1729">Search this device</text>
    <text x="414" y="192" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6478">From two characters.</text>
    <rect x="664" y="132" width="306" height="96" rx="16" fill="#F7F9FC" stroke="#DCE3EE" stroke-width="1.4"/>
    <circle cx="702" cy="172" r="20" fill="#067647" fill-opacity="0.16"/>
    <circle cx="702" cy="172" r="9" fill="none" stroke="#067647" stroke-width="2.2"/><path d="M702,163 A9,9 0 0 1 702,181 Z" fill="#067647"/>
    <text x="736" y="170" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0F1729">Theme toggle</text>
    <text x="736" y="192" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6478">Light, dark, or system.</text>
</svg>

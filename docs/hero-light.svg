<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ht hd">
  <title id="ht">N Player</title>
  <desc id="hd">N Player, a standalone Android player for the video and audio already on the device.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#EEF3FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="gl" cx="0.78" cy="0.40" r="0.55">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="po" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A6B9B"/><stop offset="100%" stop-color="#1B2740"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#gl)"/>
  <rect x="80" y="96" width="64" height="5" rx="2.5" fill="#1D4ED8"/>
  <text x="80" y="176" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#0F1729">N Player</text>
  <text x="80" y="222" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6478">Your media. On your device. Your rules.</text>
  <text x="80" y="256" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#5A6478">A standalone Android player for the files already on your phone.</text>
  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">
    <rect x="80" y="290" width="136" height="36" rx="18" fill="#E8F0FE" stroke="#C6D9F7" stroke-width="1.2"/>

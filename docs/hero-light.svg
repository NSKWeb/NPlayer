    <text x="418" y="313" fill="#1D4ED8">No network</text>
    <rect x="560" y="290" width="112" height="36" rx="18" fill="#E8F0FE" stroke="#C6D9F7" stroke-width="1.2"/>
    <text x="580" y="313" fill="#1D4ED8">Media3</text>

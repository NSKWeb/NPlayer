<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 780" width="920" height="780" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Playback sequence</title>
  <desc id="desc">Sequence diagram of starting playback: the UI asks the ViewModel, which connects to the media session, resolves a stream URL, restores resume position, starts playback, then reports progress to Jellyfin on a loop.</desc>

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0B0F"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C8BA3"/>
    </marker>
    <style>
      .lane { fill:#14141b; stroke:#2A3242; stroke-width:1.4; rx:8; }
      .actor { fill:#1C1C24; stroke:#33405A; stroke-width:1.5; rx:9; }
      .actor-name { fill:#DCE3EE; font-size:12px; font-weight:600; }
      .actor-sub { fill:#8C99AE; font-size:9.5px; }
      .life { stroke:#2C3546; stroke-width:1.3; stroke-dasharray:4 5; }
      .msg { stroke:#7C8BA3; stroke-width:1.6; fill:none; marker-end:url(#ar2); }
      .msg-dash { stroke:#5C6A80; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#ar2); }
      .self { stroke:#5C6A80; stroke-width:1.4; fill:none; marker-end:url(#ar2); }
      .step { fill:#E8ECF3; font-size:11px; }
      .step-num { fill:#9ECAFF; font-size:10px; font-weight:700; }
      .note { fill:#151b26; stroke:#2E3B52; stroke-width:1; rx:6; }
      .note-t { fill:#A9B6CB; font-size:10px; }
      .phase { fill:#6E7A90; font-size:10px; font-weight:700; letter-spacing:.08em; }
    </style>
  </defs>

  <rect width="920" height="780" fill="url(#bg2)"/>

  <text x="36" y="42" fill="#F2F5FA" font-size="21" font-weight="700">Playback — from tap to Jellyfin progress</text>
  <text x="36" y="63" class="note-t">Direct play is chosen for containers ExoPlayer handles; everything else is transcoded to HLS.</text>

  <!-- Actors -->
  <g>
    <rect x="30" y="86" width="140" height="52" class="actor"/>
    <text x="44" y="108" class="actor-name">PlayerScreen</text>
    <text x="44" y="124" class="actor-sub">Compose + PlayerView</text>
  </g>
  <g>
    <rect x="206" y="86" width="150" height="52" class="actor"/>
    <text x="220" y="108" class="actor-name">PlayerViewModel</text>
    <text x="220" y="124" class="actor-sub">lifecycle-scoped</text>
  </g>
  <g>
    <rect x="392" y="86" width="168" height="52" class="actor"/>
    <text x="406" y="108" class="actor-name">PlaybackController</text>
    <text x="406" y="124" class="actor-sub">MediaController + streams</text>
  </g>
  <g>
    <rect x="596" y="86" width="150" height="52" class="actor"/>
    <text x="610" y="108" class="actor-name">PlaybackService</text>
    <text x="610" y="124" class="actor-sub">ExoPlayer + session</text>
  </g>
  <g>
    <rect x="782" y="86" width="108" height="52" class="actor"/>
    <text x="796" y="108" class="actor-name">Jellyfin</text>
    <text x="796" y="124" class="actor-sub">your server</text>
  </g>

  <!-- Lifelines -->
  <line x1="100" y1="138" x2="100" y2="720" class="life"/>
  <line x1="281" y1="138" x2="281" y2="720" class="life"/>
  <line x1="476" y1="138" x2="476" y2="720" class="life"/>
  <line x1="671" y1="138" x2="671" y2="720" class="life"/>
  <line x1="836" y1="138" x2="836" y2="720" class="life"/>

  <text x="30" y="164" class="phase">PHASE 1 — RESOLVE</text>

  <!-- 1 -->
  <text x="104" y="188" class="step-num">1</text>
  <line x1="100" y1="196" x2="281" y2="196" class="msg"/>
  <text x="112" y="192" class="step">onEnter(itemId)</text>

  <text x="285" y="222" class="step-num">2</text>
  <line x1="281" y1="230" x2="476" y2="230" class="msg"/>
  <text x="293" y="226" class="step">connect() → MediaController binds to PlaybackService</text>

  <line x1="476" y1="252" x2="671" y2="252" class="msg"/>
  <text x="488" y="248" class="step">SessionToken → onGetSession()</text>

  <text x="285" y="278" class="step-num">3</text>
  <line x1="281" y1="286" x2="836" y2="286" class="msg"/>
  <text x="297" y="282" class="step">GET Users/{id}/Items/{itemId} — full DTO with MediaSources</text>

  <line x1="836" y1="308" x2="281" y2="308" class="msg-dash"/>
  <text x="470" y="304" class="step">BaseItemDto</text>

  <text x="30" y="338" class="phase">PHASE 2 — START</text>

  <!-- URL -->
  <text x="285" y="360" class="step-num">4</text>
  <line x1="281" y1="368" x2="476" y2="368" class="msg"/>
  <text x="293" y="364" class="step">play(item)</text>

  <rect x="300" y="380" width="360" height="66" class="note"/>
  <text x="312" y="398" class="note-t">StreamUrls.streamUrl(server, token, itemId, mediaSource)</text>
  <text x="312" y="415" class="note-t">mp4 / mkv / webm / audio → /Videos/{id}/stream (static)</text>
  <text x="312" y="432" class="note-t">otherwise → /Videos/{id}/master.m3u8  (HLS transcode)</text>

  <text x="285" y="470" class="step-num">5</text>
  <line x1="476" y1="478" x2="100" y2="478" class="msg-dash"/>
  <text x="300" y="474" class="step">positionStore.position(itemId) → resume millis (DataStore)</text>

  <text x="285" y="506" class="step-num">6</text>
  <line x1="281" y1="514" x2="671" y2="514" class="msg"/>
  <text x="297" y="510" class="step">setMediaItem(item, startPosition) · prepare() · play()</text>

  <rect x="300" y="528" width="360" height="44" class="note"/>
  <text x="312" y="546" class="note-t">PlaybackService feeds ExoPlayer through OkHttpDataSource,</text>
  <text x="312" y="562" class="note-t">so auth headers apply to media bytes too.</text>

  <text x="30" y="600" class="phase">PHASE 3 — REPORT (loops every 10 s)</text>

  <text x="479" y="622" class="step-num">7</text>
  <line x1="476" y1="630" x2="836" y2="630" class="msg"/>
  <text x="492" y="626" class="step">POST Sessions/Playing  — playback started</text>

  <path d="M 476 656 C 560 656, 560 676, 476 676" class="self"/>
  <text x="566" y="652" class="step">every 10 s: currentPosition →</text>
  <text x="566" y="668" class="step">positionStore.save + reportPlaybackProgress</text>

  <line x1="476" y1="700" x2="836" y2="700" class="msg"/>
  <text x="492" y="696" class="step">POST Sessions/Playing/Progress — ticks + isPaused</text>

  <line x1="476" y1="726" x2="836" y2="726" class="msg-dash"/>
  <text x="492" y="722" class="step">POST Sessions/Playing/Stopped on leave — final position</text>
</svg>

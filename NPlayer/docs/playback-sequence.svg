<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 780" width="920" height="780" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Playback sequence</title>
  <desc id="desc">Sequence diagram of starting playback: the UI asks the ViewModel, which connects to the media session, resolves a stream URL, restores resume position, starts playback, then reports progress to Jellyfin on a loop.</desc>

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0B0F" />
      <stop offset="100%" stop-color="#121218" />
    </linearGradient>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C8BA3" />
    </marker>
    </defs>

  <rect width="920" height="780" fill="url(#bg2)" />

  <text x="36" y="42" fill="#F2F5FA" font-size="21" font-weight="700">Playback — from tap to Jellyfin progress</text>
  <text x="36" y="63" fill="#A9B6CB" font-size="10px">Direct play is chosen for containers ExoPlayer handles; everything else is transcoded to HLS.</text>

  
  <g>
    <rect x="30" y="86" width="140" height="52" fill="#1C1C24" stroke="#33405A" stroke-width="1.5" rx="9" />
    <text x="44" y="108" fill="#DCE3EE" font-size="12px" font-weight="600">PlayerScreen</text>
    <text x="44" y="124" fill="#8C99AE" font-size="9.5px">Compose + PlayerView</text>
  </g>
  <g>
    <rect x="206" y="86" width="150" height="52" fill="#1C1C24" stroke="#33405A" stroke-width="1.5" rx="9" />
    <text x="220" y="108" fill="#DCE3EE" font-size="12px" font-weight="600">PlayerViewModel</text>
    <text x="220" y="124" fill="#8C99AE" font-size="9.5px">lifecycle-scoped</text>
  </g>
  <g>
    <rect x="392" y="86" width="168" height="52" fill="#1C1C24" stroke="#33405A" stroke-width="1.5" rx="9" />
    <text x="406" y="108" fill="#DCE3EE" font-size="12px" font-weight="600">PlaybackController</text>
    <text x="406" y="124" fill="#8C99AE" font-size="9.5px">MediaController + streams</text>
  </g>
  <g>
    <rect x="596" y="86" width="150" height="52" fill="#1C1C24" stroke="#33405A" stroke-width="1.5" rx="9" />
    <text x="610" y="108" fill="#DCE3EE" font-size="12px" font-weight="600">PlaybackService</text>
    <text x="610" y="124" fill="#8C99AE" font-size="9.5px">ExoPlayer + session</text>
  </g>
  <g>
    <rect x="782" y="86" width="108" height="52" fill="#1C1C24" stroke="#33405A" stroke-width="1.5" rx="9" />
    <text x="796" y="108" fill="#DCE3EE" font-size="12px" font-weight="600">Jellyfin</text>
    <text x="796" y="124" fill="#8C99AE" font-size="9.5px">your server</text>
  </g>

  
  <line x1="100" y1="138" x2="100" y2="720" stroke="#2C3546" stroke-width="1.3" stroke-dasharray="4 5" />
  <line x1="281" y1="138" x2="281" y2="720" stroke="#2C3546" stroke-width="1.3" stroke-dasharray="4 5" />
  <line x1="476" y1="138" x2="476" y2="720" stroke="#2C3546" stroke-width="1.3" stroke-dasharray="4 5" />
  <line x1="671" y1="138" x2="671" y2="720" stroke="#2C3546" stroke-width="1.3" stroke-dasharray="4 5" />
  <line x1="836" y1="138" x2="836" y2="720" stroke="#2C3546" stroke-width="1.3" stroke-dasharray="4 5" />

  <text x="30" y="164" fill="#6E7A90" font-size="10px" font-weight="700" letter-spacing=".08em">PHASE 1 — RESOLVE</text>

  
  <text x="104" y="188" fill="#9ECAFF" font-size="10px" font-weight="700">1</text>
  <line x1="100" y1="196" x2="281" y2="196" stroke="#7C8BA3" stroke-width="1.6" fill="none" marker-end="url(#ar2)" />
  <text x="112" y="192" fill="#E8ECF3" font-size="11px">onEnter(itemId)</text>

  <text x="285" y="222" fill="#9ECAFF" font-size="10px" font-weight="700">2</text>
  <line x1="281" y1="230" x2="476" y2="230" stroke="#7C8BA3" stroke-width="1.6" fill="none" marker-end="url(#ar2)" />
  <text x="293" y="226" fill="#E8ECF3" font-size="11px">connect() → MediaController binds to PlaybackService</text>

  <line x1="476" y1="252" x2="671" y2="252" stroke="#7C8BA3" stroke-width="1.6" fill="none" marker-end="url(#ar2)" />
  <text x="488" y="248" fill="#E8ECF3" font-size="11px">SessionToken → onGetSession()</text>

  <text x="285" y="278" fill="#9ECAFF" font-size="10px" font-weight="700">3</text>
  <line x1="281" y1="286" x2="836" y2="286" stroke="#7C8BA3" stroke-width="1.6" fill="none" marker-end="url(#ar2)" />
  <text x="297" y="282" fill="#E8ECF3" font-size="11px">GET Users/{id}/Items/{itemId} — full DTO with MediaSources</text>

  <line x1="836" y1="308" x2="281" y2="308" stroke="#5C6A80" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#ar2)" />
  <text x="470" y="304" fill="#E8ECF3" font-size="11px">BaseItemDto</text>

  <text x="30" y="338" fill="#6E7A90" font-size="10px" font-weight="700" letter-spacing=".08em">PHASE 2 — START</text>

  
  <text x="285" y="360" fill="#9ECAFF" font-size="10px" font-weight="700">4</text>
  <line x1="281" y1="368" x2="476" y2="368" stroke="#7C8BA3" stroke-width="1.6" fill="none" marker-end="url(#ar2)" />
  <text x="293" y="364" fill="#E8ECF3" font-size="11px">play(item)</text>

  <rect x="300" y="380" width="360" height="66" fill="#151b26" stroke="#2E3B52" stroke-width="1" rx="6" />
  <text x="312" y="398" fill="#A9B6CB" font-size="10px">StreamUrls.streamUrl(server, token, itemId, mediaSource)</text>
  <text x="312" y="415" fill="#A9B6CB" font-size="10px">mp4 / mkv / webm / audio → /Videos/{id}/stream (static)</text>
  <text x="312" y="432" fill="#A9B6CB" font-size="10px">otherwise → /Videos/{id}/master.m3u8  (HLS transcode)</text>

  <text x="285" y="470" fill="#9ECAFF" font-size="10px" font-weight="700">5</text>
  <line x1="476" y1="478" x2="100" y2="478" stroke="#5C6A80" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#ar2)" />
  <text x="300" y="474" fill="#E8ECF3" font-size="11px">positionStore.position(itemId) → resume millis (DataStore)</text>

  <text x="285" y="506" fill="#9ECAFF" font-size="10px" font-weight="700">6</text>
  <line x1="281" y1="514" x2="671" y2="514" stroke="#7C8BA3" stroke-width="1.6" fill="none" marker-end="url(#ar2)" />
  <text x="297" y="510" fill="#E8ECF3" font-size="11px">setMediaItem(item, startPosition) · prepare() · play()</text>

  <rect x="300" y="528" width="360" height="44" fill="#151b26" stroke="#2E3B52" stroke-width="1" rx="6" />
  <text x="312" y="546" fill="#A9B6CB" font-size="10px">PlaybackService feeds ExoPlayer through OkHttpDataSource,</text>
  <text x="312" y="562" fill="#A9B6CB" font-size="10px">so auth headers apply to media bytes too.</text>

  <text x="30" y="600" fill="#6E7A90" font-size="10px" font-weight="700" letter-spacing=".08em">PHASE 3 — REPORT (loops every 10 s)</text>

  <text x="479" y="622" fill="#9ECAFF" font-size="10px" font-weight="700">7</text>
  <line x1="476" y1="630" x2="836" y2="630" stroke="#7C8BA3" stroke-width="1.6" fill="none" marker-end="url(#ar2)" />
  <text x="492" y="626" fill="#E8ECF3" font-size="11px">POST Sessions/Playing  — playback started</text>

  <path d="M 476 656 C 560 656, 560 676, 476 676" stroke="#5C6A80" stroke-width="1.4" fill="none" marker-end="url(#ar2)" />
  <text x="566" y="652" fill="#E8ECF3" font-size="11px">every 10 s: currentPosition →</text>
  <text x="566" y="668" fill="#E8ECF3" font-size="11px">positionStore.save + reportPlaybackProgress</text>

  <line x1="476" y1="700" x2="836" y2="700" stroke="#7C8BA3" stroke-width="1.6" fill="none" marker-end="url(#ar2)" />
  <text x="492" y="696" fill="#E8ECF3" font-size="11px">POST Sessions/Playing/Progress — ticks + isPaused</text>

  <line x1="476" y1="726" x2="836" y2="726" stroke="#5C6A80" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#ar2)" />
  <text x="492" y="722" fill="#E8ECF3" font-size="11px">POST Sessions/Playing/Stopped on leave — final position</text>
</svg>
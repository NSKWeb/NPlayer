name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.0.1 (must already exist)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: NPlayer

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::No release keystore secret set; falling back to the debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu
          APK=app/build/outputs/apk/release/NPlayer.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          # apksigner mixes warnings into stderr, so merge the streams. Take the
          # pipeline's real status, not sed's, or a failed verify looks like success.
          set -o pipefail
          RAW=$("$APKSIGNER" verify --print-certs "$APK" 2>&1) || true
          echo "--- apksigner output ---"
          echo "$RAW"
          echo "------------------------"
          SIGNER=$(printf '%s\n' "$RAW" | sed -n 's/^Signer #1 certificate DN: //p')
          echo "Signed by: ${SIGNER:-<could not read>}"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            # Fail closed: an unreadable signer must not pass as a good one.
            if [ -z "$SIGNER" ]; then
              echo "::error::Could not determine the APK signer."
              exit 1
            fi
            case "$SIGNER" in
              *"Android Debug"*) echo "::error::Expected the release key but got the debug key."; exit 1 ;;
            esac
          fi

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${{ steps.meta.outputs.tag }}"
          APK="NPlayer/app/build/outputs/apk/release/NPlayer.apk"
          test -f "$APK"

          # The asset keeps its plain name so the stable
          # releases/latest/download/NPlayer.apk link stays valid.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "N Player $TAG" \
              --generate-notes
          fi
